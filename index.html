<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Building Walkthrough</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud">
        <div class="mode-group">
          <button data-mode="orbit" class="active">Quan sát</button>
          <button data-mode="fly">Bay</button>
          <button data-mode="walk">Đi bộ</button>
          <button data-mode="exterior">Ngoại thất</button>
        </div>

        <div class="floor-group" id="floors"></div>
      </div>

      <div id="crosshair" hidden>+</div>
      <div id="hint">Nhấp vào màn hình để điều khiển • ESC để thoát</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
